name: Build and Release TINY Scanner Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Required permission to create releases and upload assets
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release Standalone Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Set up MSYS2 UCRT64 environment (used locally)
      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            zip

      # 2. Configure, Build, and Run Tests inside the UCRT64 shell
      - name: Build and Test with CMake & Ninja
        shell: msys2 {0}
        run: |
          mkdir build
          cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .
          
          # Run the unit tests automatically on CI
          ./ScannerUnitTests.exe

      # 3. Package Executable, DLLs, and Plugins into a Clean Zip Archive
      - name: Package Standalone Distribution
        shell: msys2 {0}
        run: |
          mkdir -p dist
          # Copy main executable
          cp build/TINYScanner.exe dist/
          
          # Use windeployqt6 to bundle Qt DLLs, plugins, and translations automatically
          /ucrt64/bin/windeployqt6.exe --release dist/TINYScanner.exe
          
          # Copy standard GCC / C++ runtimes
          cp /ucrt64/bin/libstdc++-6.dll dist/
          cp /ucrt64/bin/libgcc_s_seh-1.dll dist/
          cp /ucrt64/bin/libwinpthread-1.dll dist/
          cp /ucrt64/bin/libdouble-conversion.dll dist/
          
          # Copy ICU & Internationalization libraries (using wildcards to avoid version mismatches)
          cp /ucrt64/bin/libicuuc*.dll dist/
          cp /ucrt64/bin/libicuin*.dll dist/
          cp /ucrt64/bin/libicudt*.dll dist/
          
          # Copy Font shaping, graphics, and text rendering libraries (from your screenshot)
          cp /ucrt64/bin/libglib-2.0*.dll dist/
          cp /ucrt64/bin/libharfbuzz*.dll dist/
          cp /ucrt64/bin/libgraphite2*.dll dist/
          cp /ucrt64/bin/libbrotlicommon*.dll dist/
          cp /ucrt64/bin/libbrotlidec*.dll dist/
          cp /ucrt64/bin/libfreetype*.dll dist/
          cp /ucrt64/bin/libpng16*.dll dist/
          cp /ucrt64/bin/libpcre2-8-*.dll dist/
          cp /ucrt64/bin/libpcre2-16-*.dll dist/
          cp /ucrt64/bin/libmd4c*.dll dist/
          cp /ucrt64/bin/libb2*.dll dist/
          cp /ucrt64/bin/libintl*.dll dist/
          cp /ucrt64/bin/libiconv*.dll dist/
          cp /ucrt64/bin/libz*.dll dist/
          
          # Zip up the distribution folder
          cd dist
          zip -r ../TINYScanner-Windows-x64.zip *

      # 4. Automatically Create Release and Upload Asset
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: "TINYScanner Release v1.0-${{ github.run_number }}"
          body: "Automated standalone Windows release for the TINY Language Scanner."
          files: TINYScanner-Windows-x64.zip